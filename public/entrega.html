<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictamen · LMV Credia</title>
<style>
  :root{
    --tinta:#12263A; --tinta-2:#2C4A63; --papel:#F7F5F0; --linea:#D8D2C6;
    --sello:#8C1C13; --ok:#1E6F50; --aviso:#B0761A; --gris:#6B7A88;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{background:var(--tinta);color:#fff;padding:16px 20px}
  header .marca{font-weight:700;letter-spacing:.06em;font-size:14px}
  header .sub{opacity:.75;font-size:13px;margin-top:2px}
  main{max-width:520px;margin:0 auto;padding:22px 16px}
  .tarjeta{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:22px}
  .semaforo{text-align:center;padding:26px 16px;border-radius:11px;margin-bottom:20px}
  .semaforo .bola{width:78px;height:78px;border-radius:50%;margin:0 auto 14px}
  .semaforo .rotulo{font-size:23px;font-weight:800;letter-spacing:.03em}
  .semaforo .nota{font-size:14px;margin-top:5px;opacity:.85}
  .verde{background:#E9F4EF} .verde .bola{background:var(--ok)} .verde .rotulo{color:var(--ok)}
  .ambar{background:#FDF3E2} .ambar .bola{background:var(--aviso)} .ambar .rotulo{color:var(--aviso)}
  .rojo{background:#FDECEA} .rojo .bola{background:var(--sello)} .rojo .rotulo{color:var(--sello)}
  .dato{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #F0EDE7;font-size:15px}
  .dato span:first-child{color:var(--gris)}
  .dato span:last-child{font-weight:600;text-align:right}
  .notas{background:#FBFAF7;border:1px solid var(--linea);border-radius:9px;
    padding:15px;margin-top:18px;font-size:15px;white-space:pre-wrap}
  .notas h2{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--gris);margin:0 0 8px}
  .pie{font-size:12.5px;color:var(--gris);text-align:center;margin-top:20px;line-height:1.6}
  .error{text-align:center;padding:50px 20px;color:var(--gris)}
  .cargando{text-align:center;padding:50px 20px;color:var(--gris)}
</style>
</head>
<body>
<header>
  <div class="marca">LMV CREDIA, S.A. DE C.V.</div>
  <div class="sub">Dictamen de evaluación crediticia</div>
</header>
<main id="app">
  <div class="cargando">Cargando dictamen...</div>
</main>

<script>
(function(){
  'use strict';
  var partes = location.pathname.split('/');
  var token = partes[partes.length - 1];

  function esc(s){
    return (s === null || s === undefined ? '' : String(s))
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function pesos(n){
    if (n === null || n === undefined || n === '') return null;
    return '$' + Number(n).toLocaleString('es-MX',{minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fecha(f){
    if(!f) return '—';
    return new Date(f).toLocaleDateString('es-MX',
      {timeZone:'America/Mexico_City', day:'2-digit', month:'long', year:'numeric'});
  }

  var rotulos = {
    verde: {t:'Aprobado', n:'El perfil cumple con los criterios de evaluación.'},
    ambar: {t:'Con reservas', n:'Se puede proceder con condiciones. Revisa las notas.'},
    rojo:  {t:'No aprobado', n:'El perfil no cumple con los criterios de evaluación.'}
  };

  fetch('/api/dictamen/' + encodeURIComponent(token))
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(o){
      if(!o.ok){
        document.getElementById('app').innerHTML =
          '<div class="tarjeta"><div class="error">' + esc(o.j.error || 'No se pudo abrir el dictamen.') + '</div></div>';
        return;
      }
      var d = o.j;
      var r = rotulos[d.semaforo] || rotulos.ambar;
      var monto = pesos(d.monto_sugerido);
      var h = '<div class="tarjeta">' +
        '<div class="semaforo ' + esc(d.semaforo) + '">' +
          '<div class="bola"></div>' +
          '<div class="rotulo">' + esc(r.t) + '</div>' +
          '<div class="nota">' + esc(r.n) + '</div>' +
        '</div>' +
        '<div class="dato"><span>Folio</span><span>' + esc(d.folio) + '</span></div>' +
        '<div class="dato"><span>Solicitante</span><span>' + esc(d.cliente) + '</span></div>' +
        (d.agencia ? '<div class="dato"><span>Agencia</span><span>' + esc(d.agencia) + '</span></div>' : '') +
        (monto ? '<div class="dato"><span>Monto sugerido</span><span>' + esc(monto) + '</span></div>' : '') +
        '<div class="dato"><span>Fecha del dictamen</span><span>' + fecha(d.fecha) + '</span></div>';
      if (d.notas && d.notas.trim()){
        h += '<div class="notas"><h2>Notas</h2>' + esc(d.notas) + '</div>';
      }
      h += '</div>' +
        '<p class="pie">Este dictamen es la evaluación de LMV Credia, S.A. de C.V. ' +
        'No constituye ni contiene un reporte de crédito. Su contenido es confidencial ' +
        'y de uso exclusivo del destinatario.</p>';
      document.getElementById('app').innerHTML = h;
    })
    .catch(function(){
      document.getElementById('app').innerHTML =
        '<div class="tarjeta"><div class="error">No hay conexión. Intenta de nuevo.</div></div>';
    });
})();
</script>
</body>
</html>
